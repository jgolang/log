name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: gofmt (root)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet (root)
        run: go vet ./...
      - name: test (root)
        run: go test -race -cover ./...
      - name: govulncheck (root)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: gofmt (otel)
        working-directory: otel
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet (otel)
        working-directory: otel
        run: go vet ./...
      - name: test (otel)
        working-directory: otel
        run: go test -race -cover ./...
      - name: govulncheck (otel)
        working-directory: otel
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      # The steps above test otel against the published log it requires. This
      # one tests it against the log in this commit, so a root change that
      # breaks otel fails here instead of at the next otel release. The replace
      # exists only in the CI checkout; never commit it.
      - name: test (otel against this commit's log)
        working-directory: otel
        run: |
          go mod edit -replace github.com/jgolang/log=../
          go mod tidy
          go test -race ./...
